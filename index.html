<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Chrono-Clone</title>
  <link rel="stylesheet" href="src/ui/styles.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">Timelines</span>
        <span class="hud-value" id="tl-count">0</span>
      </div>
      <div id="timer-bar-wrap">
        <div class="hud-label" style="text-align:center;margin-bottom:4px">TIME REMAINING</div>
        <div id="timer-bar-bg"><div id="timer-bar"></div></div>
      </div>
      <div class="hud-item">
        <span class="hud-label">Round</span>
        <span class="hud-value" id="round-count">1</span>
      </div>
    </div>

    <div id="objective">
      <div id="obj1">▶ GRAB THE KEY</div>
      <div id="obj2">▶ REACH THE EXIT</div>
    </div>

    <div id="clones-info"></div>

    <div id="msg-overlay">
      <h2 id="msg-title">CHRONO·CLONE</h2>
      <p id="msg-sub">WASD / ARROWS TO MOVE · SPACE TO REWIND</p>
    </div>

    <div id="btns">
      <button id="startBtn">▶ START</button>
      <button id="rewindBtn" style="display:none">⟲ REWIND</button>
    </div>
  </div>

  <canvas id="joystick-canvas"></canvas>
  <button id="mobile-rewind-btn" aria-label="Rewind">⟲</button>

  <div id="portrait-warning">
    <div class="pw-inner">
      <div class="pw-icon">📱</div>
      <p>Rotate to landscape<br>for best experience</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
